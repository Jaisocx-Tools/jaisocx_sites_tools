<!DOCTYPE html>
<html lang="en" class="jaisocx clean_start" xmlns="http://www.w3.org/1999/html">

  <link
      rel="icon"
      type="image/x-icon"
      href="Icon_Jaisocx.ico"
  />

  <title> clean_start </title>

  <meta charset="utf-8" />

  <!--# CleanStart_Tiny Fonts -->

      type="text/css"

  <!--# CleanStart_Tiny Html tags -->

      type="text/css"
      charset="utf-8"
      href="d_clean_start__html_tags.css"
  />



  <!--# CleanStart_Tiny Sites tools ( ul_li label, .scrolls ) -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="clean_start__sites_tools.css"
  />




  <!-- CleanStart_Tiny Overrides -->
  <style name="overrides">

    .jaisocx.clean_start {

      --clean_start--site--padding:                 1rem 3rem 10rem 3rem;
      --clean_start--site--width:                   70%;

      --clean_start--body_tag--background:          #f5fdf0;



      /* label */
      --clean_start--label--display:                inline-block;

      --clean_start--label--font-size:              0.79rem;
      --clean_start--label--line-height:            var(--clean_start--label--font-size);

      --clean_start--label--padding:                0.18rem 0.9rem 0.10rem 0.9rem;
      --clean_start--label--margin:                 0 0 0 0;

      --clean_start--label--color:                  #99faa9;
      --clean_start--label--background:             green;

      --clean_start--label--border:                 2px solid #99faa9;
      --clean_start--label--border-radius:          0.8rem;

      --clean_start--label--overflow-x:              hidden;
      --clean_start--label--overflow-y:              hidden;



      --clean_start--h1--font-size:                 var(--clean_start--label--font-size);
      --clean_start--h1--line-height:               var(--clean_start--label--font-size);
      --clean_start--h1--font-weight:               400;
      --clean_start--h1--margin:                    0 0 0 0;
      --clean_start--h1--color:                     var(--clean_start--label--color);
      --clean_start--h1--background:                var(--clean_start--label--background);



      --clean_start--h2--margin:                    0 0 0.3rem 0;
      --clean_start--h3--margin:                    1.6rem 0 0.3rem 0;
      --clean_start--h4--margin:                    1rem 0 0.3rem 0;

      --clean_start--h--margin:                     1rem 0 0.3rem 0;



      --clean_start--p_first--margin:                0 0 0 0;
      --clean_start--p--margin:                     1rem 0 0 0;



      --clean_start--input--padding:                0.25rem 1rem 0.25rem 1rem;
      --clean_start--select--padding:               0.25rem 1rem 0.25rem 1rem;
      --clean_start--textarea--padding:             0.25rem 1rem 0.25rem 1rem;

      --clean_start--fieldset--padding:              1rem 1rem 1rem 1rem;
      --clean_start--fieldset--border:               0.2px solid #555;
      --clean_start--fieldset_legend--padding:       0.14rem 1rem 0.14rem 1rem;
      --clean_start--fieldset_legend--margin:        0 0 0 0;
      --clean_start--fieldset_legend--border:        1px solid lime;
      --clean_start--fieldset_legend--color:         #fdfdfd;
      --clean_start--fieldset_legend--font-size:     0.7rem;
      --clean_start--fieldset_legend--line-height:   0.7rem;
      --clean_start--fieldset_legend--background:    green;

    }

  </style>





  <style name="inputs_style">

    .jaisocx.clean_start input.input_chkbox:checked::after {
      content:     '✅';
    }
    .jaisocx.clean_start input.input_chkbox::after {
      content:     '❌';
    }


    .jaisocx.clean_start input.input_radio:checked::after {
      content:     '🟡';
    }
    .jaisocx.clean_start input.input_radio::after {
      content:     '';
    }



    .jaisocx.clean_start {
      --clean_start--field--line-height:            1.62rem;
      --clean_start--field--padding:                0 0 0 1rem;
      --clean_start--field--margin:                 0 0 1rem 0;

      --clean_start--input_checkbox--font-size:    0.9rem;
      --clean_start--input_checkbox--height:       0.9rem;

      --clean_start--input_checkbox--width:        0.9rem;
    }

    .jaisocx.clean_start fieldset.group_chckboxes {
      --clean_start--input_checkbox--font-size:    0.70rem;
    }
    .jaisocx.clean_start fieldset.group_radiobuttons {
      --clean_start--input_checkbox--font-size:    0.5rem;
    }

    .clean_start fieldset.group_chckboxes,
    .clean_start fieldset.group_radiobuttons {
      --clean_start--field--margin:                 0 0 0 0;
    }






    .clean_start block.field {
      margin:                var(--clean_start--field--margin);
    }

    .clean_start block.field,
    .clean_start block.field input.input_chkbox,
    .clean_start block.field input.input_radio {

      min-height:            unset;
      max-height:            var(--clean_start--field--line-height);
      height:                var(--clean_start--field--line-height);
      line-height:           var(--clean_start--field--line-height);

      font-size:             var(--clean_start--field--line-height);

    }



    .clean_start fieldset.group_chckboxes block.field,
    .clean_start fieldset.group_radiobuttons block.field {
      position:              relative;
      display:               flex;
      align-items:           center;

      padding:               var(--clean_start--field--padding);

      z-index:     1003;

      overflow-x:   visible;
      overflow-y:   visible;
    }



    .clean_start input.input_chkbox,
    .clean_start input.input_radio {
      display:     inline-block;

      position:    absolute;
      top:         0;
      left:        0;

      min-width:   0;
      max-width:   var(--clean_start--input_checkbox--width);
      width:       var(--clean_start--input_checkbox--width);

      z-index:     1004;
      visibility:  hidden;

      overflow-x:   visible;
      overflow-y:   visible;
    }



    .clean_start input.input_chkbox::after,
    .clean_start input.input_radio::after {
      content:     '';
      display:     block;

      min-height:            unset;
      max-height:            var(--clean_start--field--line-height);
      height:                var(--clean_start--field--line-height);
      line-height:           var(--clean_start--field--line-height);

      font-size:             var(--clean_start--input_checkbox--font-size);

      position:    absolute;
      visibility:  visible;
      top:         0;
      left:        0;

      border:      0 solid magenta;

      min-width:   0;
      max-width:   var(--clean_start--input_checkbox--width);
      width:       var(--clean_start--input_checkbox--width);

      z-index:     2003;

    }

  </style>






  <!-- CleanStart_Tiny Mobile friendly -->
  <style name="mobile_friendly">

    @media only screen and (min-width: 5px) and (max-width: 280px) and (min-height: 5px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding:     1rem 0.3rem 2rem 0.3rem;
        --clean_start--site--width:       100%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 480px) and (min-height: 431px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding:     1.2rem 0.3rem 5rem 0.3rem;
        --clean_start--site--width:       92%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 1024px) and (min-height: 5px) and (max-height: 480px) and (orientation: landscape) {
      .jaisocx.clean_start {
        --clean_start--site--padding:     0.3rem 0.3rem 1rem 0.3rem;
        --clean_start--site--width:       95%;
      }
    }

  </style>

</head>
<body>
<main>

  <label> <h1> @jaisocx/clean_start  ®  </h1> </label>

  <h2> html forms </h2>

  <block class="html_forms">

    <h3> Fieldset n Legend </h3>


    <!-- @start block fieldsets_n_legends -->
    <block class="fieldsets_n_legends">

      <!-- @start fieldset 1 -->
      <fieldset>
        <legend> fieldset </legend>


        <block class="field">
          <input value="text" />
        </block>



        <block class="field">
          <select>
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </block>



        <block class="field">
          <textarea>text</textarea>
        </block>





        <h3> multiple choice </h3>

        <!-- @start fieldset 2.1 -->
        <fieldset class="group_chckboxes">
          <legend> multiple choice </legend>


          <block class="field">
            <label for="chkbox_a"> a </label>
            <input class="input_chkbox" id="chkbox_a" type="checkbox" checked="checked" />
          </block>

          <block class="field">
            <label for="chkbox_b"> b </label>
            <input class="input_chkbox" id="chkbox_b" type="checkbox" />
          </block>

          <block class="field">
            <label for="chkbox_c"> c </label>
            <input class="input_chkbox" id="chkbox_c" type="checkbox" />
          </block>

          <block class="field">
            <label for="chkbox_d"> d </label>
            <input class="input_chkbox" id="chkbox_d" type="checkbox" />
          </block>

          <block class="field">
            <label for="chkbox_e"> e </label>
            <input class="input_chkbox" id="chkbox_e" type="checkbox" />
          </block>

        </fieldset>
        <!-- @finish fieldset 2.1 -->





        <h3> radiobutton </h3>

        <!-- @start fieldset 2.2 -->
        <fieldset class="group_radiobuttons">
          <legend> group of inputs radiobutton </legend>

          <block class="field">
            <label for="a"> radiobutton a </label>
            <input class="input_radio" id="a" name="radiobuttons_group_a" type="radio" checked="checked" />
          </block>

          <block class="field">
            <label for="b"> radiobutton b </label>
            <input class="input_radio" id="b" name="radiobuttons_group_a" type="radio" />
          </block>

          <block class="field">
            <label for="c"> radiobutton c </label>
            <input class="input_radio" id="c" name="radiobuttons_group_a" type="radio" />
          </block>

          <block class="field">
            <label for="d"> radiobutton d </label>
            <input class="input_radio" id="d" name="radiobuttons_group_a" type="radio" />
          </block>

          <block class="field">
            <label for="e"> radiobutton e </label>
            <input class="input_radio" id="e" name="radiobuttons_group_a" type="radio" />
          </block>

        </fieldset>
        <!-- @finish fieldset 2.2 -->



        <block class="field">
          <button> Ok </button>
        </block>

      </fieldset>
      <!-- @finish fieldset 1 -->

    </block>
    <!-- @finish block fieldsets_n_legends -->





    <h3> input </h3>

    <block class="field">
      <input value="text" />
    </block>



    <h3> select </h3>

    <block class="field">
      <select>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </block>



    <h3> textarea </h3>

    <block class="field">
      <textarea>text</textarea>
    </block>



    <h3> button </h3>

    <block class="field">
      <button>button</button>
    </block>


  </block>

</main>
</body>
</html>
