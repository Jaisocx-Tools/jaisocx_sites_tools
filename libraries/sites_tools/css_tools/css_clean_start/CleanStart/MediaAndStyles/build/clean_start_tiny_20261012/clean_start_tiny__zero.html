<!DOCTYPE html>
<html lang="en" class="jaisocx clean_start">
<head>

  <!--# FAVICON -->
  <link
      rel="icon"
      type="image/x-icon"
      href="Icon_Jaisocx.ico"
  />

  <title> Jaisocx clean_start_tiny </title>



  <base href="./" />

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />



  <!--# CleanStart_Tiny Fonts -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="clean_start_tiny__base.css"
  />



  <!--# CleanStart_Tiny Overrides -->
  <style name="overrides">
    .jaisocx.clean_start {
      --clean_start--input--padding: 0.25rem 1rem 0.25rem 1rem;
      --clean_start--select--padding: 0.25rem 1rem 0.25rem 1rem;
      --clean_start--textarea--padding: 0.25rem 1rem 0.25rem 1rem;


      --clean_start--site--padding: 1rem 3rem 10rem 3rem;
      --clean_start--site--width: 55%;


      --clean_start--h--margin: 1rem 0 0.39rem 0;


      --clean_start--p_first--margin: 0 0 0 0;
      --clean_start--p--margin: 1rem 0 0 0;



      /* label */
      --clean_start--label--display:           inline-block;

      --clean_start--label--font-size:         0.79rem;
      --clean_start--label--line-height:       var(--clean_start--label--font-size);

      --clean_start--label--padding:           0.12rem 0.5rem 0.16rem 0.5rem;
      --clean_start--label--margin:            0 0 0 0;

      --clean_start--label--color:             green;
      --clean_start--label--background-color:  #eefafd;

      --clean_start--label--border:            1px solid green;
      --clean_start--label--border-radius:     0.8rem;

      --clean_start--label--overflow-x:        hidden;
      --clean_start--label--overflow-y:        hidden;



      --clean_start--fieldset--padding: 1rem 1rem 1rem 1rem;
      --clean_start--fieldset--border: 0.2px solid #555;
      --clean_start--fieldset_legend--padding: 0.14rem 1rem 0.14rem 1rem;
      --clean_start--fieldset_legend--margin: 0 0 0 0;
      --clean_start--fieldset_legend--border: 1px solid lime;
      --clean_start--fieldset_legend--color: #fdfdfd;
      --clean_start--fieldset_legend--font-size: 0.7rem;
      --clean_start--fieldset_legend--line-height: 0.7rem;
      --clean_start--fieldset_legend--background: green;


      --clean_start--ol_li_c--font-size: 0.9rem;

      --clean_start--ol_li--padding: 0 0 0 0.7rem;
      --clean_start--li_ol_li--padding: 0 0 0 0.7rem;
      --clean_start--ol--margin: 0 0 0 0;
      --clean_start--li_ol--margin: 0 0 0 1rem;


      --clean_start--ul_li_c--content: '🟢';
      --clean_start--ul_li_c--font-size: 0.25rem;

      --clean_start--ul_li--padding: 0 0 0 0.7rem;
      --clean_start--li_ul_li--padding: 0 0 0 0.7rem;
      --clean_start--ul--margin: 0 0 0 0;
      --clean_start--li_ul--margin: 0 0 0 1rem;


      --clean_start--dl_dt_dd_c--content: '🟠';
      --clean_start--dl_dt_dd_c--font-size: 0.25rem;

      --clean_start--dl--padding:  0 0 0 0.4rem;

      --clean_start--dl_dt_dd--padding:  0 0 0 0.73rem;
      --clean_start--dl_dt_dd--margin:  0 0 0 0.9rem;
      --clean_start--dl_dt_dd--display:  block;


      --clean_start--table_caption--padding:  0.9rem 0 0.55rem 0;
      --clean_start--table_caption--color:  #3ac020;
      --clean_start--table_caption--line-height:  0.79rem;
      --clean_start--table_caption--font-size:  0.79rem;

      --clean_start--table_th--padding:  0.25rem 1rem 0.25rem 1rem;
      --clean_start--table_td--padding:  0.25rem 1rem 0.25rem 1rem;
      --clean_start--table_tf--padding:  0.25rem 1rem 0.25rem 1rem;

      --clean_start--table--border:  1px solid lime;

      --clean_start--table_th--font-size:  0.8rem;
      --clean_start--table_th--color:  #3ac020;
      --clean_start--table_caption--background:  #fefffd;
      --clean_start--table_th--background:  #fefffd;
      --clean_start--table_td--background:  #f9fdf2;
      --clean_start--table_tf--background:  #eefdc9;
    }



    .jaisocx.clean_start ol.inline {
      --clean_start--ol_li_c--content: '|';
      --clean_start--ol_li_c--font-size: 0.79rem;
      --clean_start--ol_li--padding: 0 0.33rem 0 0.7rem;
    }

    .jaisocx.clean_start ul.inline {
      --clean_start--ul_li_c--content: '|';
      --clean_start--ul_li_c--font-size: 0.79rem;
      --clean_start--ul_li--padding: 0 0.33rem 0 0.7rem;
    }

  </style>



  <!-- CleanStart_Tiny Mobile friendly -->
  <style name="mobile_friendly">

    @media only screen and (min-width: 5px) and (max-width: 280px) and (min-height: 5px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding: 1rem 0.3rem 2rem 0.3rem;
        --clean_start--site--width: 100%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 480px) and (min-height: 431px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {
        --clean_start--site--padding: 1.2rem 0.3rem 5rem 0.3rem;
        --clean_start--site--width: 92%;
      }
    }

    @media only screen and (min-width: 281px) and (max-width: 1024px) and (min-height: 5px) and (max-height: 480px) and (orientation: landscape) {
      .jaisocx.clean_start {
        --clean_start--site--padding: 0.3rem 0.3rem 1rem 0.3rem;
        --clean_start--site--width: 95%;
      }
    }

  </style>

</head>
<body>
<main>

  <h1> clean_start_tiny zero ® </h1>



  <h2> Scrollbars </h2>

  <block class="scrolls">
    <block class="font_override font_sans">
      <p>
        <label> Label </label>
        <a href="javascript: void(0);"> link </a>
        <text> Sentence paragraph 1. </text>
      </p>
    </block>
  </block>





  <h2> lists </h2>


  <h3> links </h3>

  <block>

    <label> inline </label>

    <ul class="inline">
      <li>
        <a href="javascript: void(0);">link a</a>
      </li>
      <li>
        <a href="javascript: void(0);">link b</a>
      </li>
    </ul>

  </block>



  <h3> texts </h3>

  <block>

    <label> 🗒 💲 🍰 Shopping </label>

    <ul class="shopping">
      <li><text>  🍎  Apples </text></li>
      <li><text>  🍌  Bananas </text></li>
      <li><text>  🍊 Orange </text></li>
    </ul>

  </block>




</main>
</body>
</html>
